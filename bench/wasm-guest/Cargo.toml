[package]
name = "pulse-privacy-wasm-guest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Same verifiers compiled to wasm32-unknown-unknown, to measure the in-contract (no intrinsic) cost under wasmer"

[lib]
crate-type = ["cdylib"]

[dependencies]
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
ark-ed-on-bn254 = "0.5"
bulletproofs = "5"
curve25519-dalek = { version = "4", features = ["rand_core"] }
merlin = "3"
rand = "0.8"
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# bulletproofs → clear_on_drop builds a C helper by default; not possible for wasm32.
[dependencies.clear_on_drop]
version = "0.2"
features = ["no_cc"]
