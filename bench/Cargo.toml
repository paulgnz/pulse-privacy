[package]
name = "pulse-privacy-bench"
version = "0.1.0"
edition = "2021"
description = "Verifier micro-benchmarks for the PulseVM confidential-transfer track (Phase 0)"
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
# Groth16 / bn254 (the Leap CRYPTO_PRIMITIVES alt_bn128_* set)
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
# Baby Jubjub: twisted-Edwards curve over bn254's scalar field (ElGamal inside the circuit)
ark-ed-on-bn254 = "0.5"
# Bulletproofs fallback (ristretto255, no trusted setup)
bulletproofs = "5"
curve25519-dalek = { version = "4", features = ["rand_core"] }
merlin = "3"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
